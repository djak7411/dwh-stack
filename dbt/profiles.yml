analytics_platform:
  target: clickhouse
  outputs:
    # Для чтения из Spark/Iceberg (используем HTTP метод)
    dev:
      type: spark
      method: http
      host: spark
      port: 8080
      schema: analytics
      organization: 0
      connect_timeout: 60
      connect_retries: 3
      
    clickhouse:
      type: clickhouse
      host: clickhouse
      port: 9000
      database: analytics
      user: admin
      password: password
      schema: analytics
      threads: 1